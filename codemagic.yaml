workflows:
  android-emma-apk:
    name: Armar APK Emma Data Driver
    max_build_duration: 15
    environment:
      java: 17
    scripts:
      - name: Instalar Gradle 8.5 y compilar APK
        script: |
          wget -q https://gradle.org
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      
